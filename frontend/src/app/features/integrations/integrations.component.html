<div class="eg">
  @for (integration of statusOfAllowedIntegrations(); track integration) {
    <mat-card appearance="outlined">
      <mat-card-content>
        <h2>{{ integration.name }}</h2>
        @if (!integration.enabled) {
          <button mat-stroked-button (click)="integrateWithThirdParty(integration.name)">
            <mat-icon>add</mat-icon>
            Enable integration
          </button>
        }
      </mat-card-content>
    </mat-card>
  }
</div>
